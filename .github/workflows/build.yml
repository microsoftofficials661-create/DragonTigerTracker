name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android APK
        uses: kevin-david/android-build-action@v1.4.1
        with:
          project-path: '.'
          gradle-task: 'assembleDebug'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonTiger-APK
          path: "**/*.apk"
